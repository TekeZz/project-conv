<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Project Convertendo</title>

    <link rel="stylesheet" href="./styles.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap" rel="stylesheet">


</head>

<body>

    <header>
        <img class="LogoConv" src="./assest/converter.png" alt="Logo-converter">
    </header>

    <main class="main-converter">

        <section class="infos">
            <label>
                Converter de:
                

                <select class="select">
                    <option>R$ Real Brasileiro</option>
                </select>
            </label>
            
            <label>
                Converter para:
                
                <select class="select">
                    <option>U$ Dólar Americano</option>
                    <option>€ Euro</option>
                </select>
            </label>
            <br>
            <label>
                Valor:
              

                <input type="number" placeholder="0,00">

            </label>
        </section>

        <button>
            <img class="btn-img" src="./assest/seta.png" alt="seta">
        </button>

        <div class="result-box">
            <img src="./assest/real-cor.png" alt="real-cor">

            <p>Real Brasileiro</p>
            <p class="value"> 0,00</p>
        </div>

        <div class="result-box">
            <img src="./assest/dolar-cor.png" alt="dolar-cor">

            <p>Dólar Americano</p>
            <p class="value"> 0,00</p>
        </div>

    </main>

</body>

</html>
